# One-click deploy on Render: https://render.com/deploy
# Creates the Lote web service with a persistent disk for the database.
services:
  - type: web
    name: lote
    runtime: docker
    rootDir: app
    plan: starter
    healthCheckPath: /api/content
    disk:
      name: lote-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/lote.db
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: LIVE_CLASS_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
