# One-click deploy on Render (New → Blueprint). Deploys GreenLight with a disk for its database.
services:
  - type: web
    name: greenlight
    runtime: docker
    rootDir: greenlight
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: greenlight-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/greenlight.db
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_TEAM
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
